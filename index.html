<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>デジタルスタンプラリー 順位表</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f0f0f0;
      margin: 0;
      padding: 10px;
    }
    .container {
      overflow-x: auto;
    }
    table {
      border-collapse: collapse;
      min-width: 700px;
      margin: 0 auto;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
      white-space: nowrap;
    }
    thead {
      background: #ddd;
      position: sticky;
      top: 0;
    }
    .gold {
      background: #f9ca00;
      color: #fff;
    }
    .silver {
      background: #c0c0c0;
      color: #fff;
    }
    .bronze {
      background: #cd7f32;
      color: #fff;
    }
    #loading {
      text-align: center;
      font-size: 1.2em;
      padding: 20px;
      color: #555;
    }
  </style>
</head>
<body>
  <div id="loading">読み込み中...</div>
  <div class="container" id="scrollContainer" style="display:none;">
    <table id="sheetTable"></table>
  </div>

  <script>
    function loadSheet() {
      // 画面全体のスクロール位置を記録
      const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
      const scrollLeft = window.pageXOffset || document.documentElement.scrollLeft;

      document.getElementById("loading").style.display = "block";
      document.getElementById("scrollContainer").style.display = "none";

      google.script.run.withSuccessHandler(function(data) {
        renderTable(data);

        // スクロール位置を復元
        window.scrollTo(scrollLeft, scrollTop);
      }).getSheetData();
    }

    function renderTable(data) {
      const table = document.getElementById("sheetTable");
      table.innerHTML = "";

      const headers = data.headers;
      const rows = data.rows;

      if (!headers || headers.length === 0) return;

      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");
      headers.forEach(h => {
        const th = document.createElement("th");
        th.textContent = h;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      rows.forEach(row => {
        const tr = document.createElement("tr");
        row.forEach((cell, colIndex) => {
          const td = document.createElement("td");
          td.textContent = cell ?? "";
          tr.appendChild(td);
        });

        const rank = parseInt(row[0]);
        if (rank === 1) tr.classList.add("gold");
        if (rank === 2) tr.classList.add("silver");
        if (rank === 3) tr.classList.add("bronze");

        tbody.appendChild(tr);
      });
      table.appendChild(tbody);

      document.getElementById("loading").style.display = "none";
      document.getElementById("scrollContainer").style.display = "block";
    }

    loadSheet();
    setInterval(loadSheet, 10000);
  </script>
</body>
</html>
